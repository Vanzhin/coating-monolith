services:
  manager_php-fpm:
    hostname: ${DOMAIN}
    image: ${REGISTRY}/${IMAGE_NAME}-php-fpm:${TAG:-latest}
    # Точечные bind-mount'ы вместо всей ./app — иначе хостовый vendor от прошлого
    # релиза перекрывает свежий из образа (при добавлении composer-пакетов
    # container'ы бегут по старому vendor'у). Плюс убирали composer install из
    # init'а — он требует достучаться до raw.githubusercontent.com (symfony/flex
    # recipes-индекс), а этот хост режется DPI-фильтром российских VDS-провайдеров.
    #  - var/: runtime state (cache, log) — пишется контейнером в runtime.
    #  - config/jwt/: keypair, генерится один раз, переживает деплой.
    #  - public/build/: webpack assets, собирает CI в node-контейнере на хосте
    #    (см. deploy.yml step yarn build) — контейнерам нужно только читать
    #    manifest.json.
    volumes:
      - ./app/.env:/app/.env:ro
      - ./app/var:/app/var:rw
      - ./app/config/jwt:/app/config/jwt:rw
      - ./app/public/build:/app/public/build:ro
    depends_on:
      manager_redis:
        condition: service_started
      manager_db:
        condition: service_healthy
    # Инит (миграции+cache+jwt+warmup) больше НЕ через depends_on — он гоняется отдельным
    # гейт-шагом ДО `up` (deploy.yml: `--profile init run --rm manager_php-cli`). Иначе падение
    # инита оставляло старый php-fpm убитым, а новый — не стартовавшим (прод лёг).
    # Healthcheck: пингуем FastCGI-порт через php (php гарантированно в образе) — чтобы `up --wait`
    # дождался РЕАЛЬНО живого fpm, а не просто «контейнер запущен».
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    working_dir: /app

  manager_supervisor:
    hostname: ${DOMAIN}
    working_dir: /app
    image: ${REGISTRY}/${IMAGE_NAME}-supervisor:${TAG:-latest}
    restart: always
    depends_on:
      manager_redis:
        condition: service_started
      manager_db:
        condition: service_healthy
    # Инит гоняется отдельным гейт-шагом ДО `up` (см. php-fpm-комментарий и deploy.yml).
    command: bash -c "/usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf"
    volumes:
      - ./app/.env:/app/.env:ro
      - ./app/var:/app/var:rw
      - ./app/config/jwt:/app/config/jwt:rw
      - ./app/public/build:/app/public/build:ro
      - ./docker/supervisor/conf.d:/etc/supervisor/conf.d
      - ./docker/supervisor/log:/var/log/supervisor

  # Init-контейнер (one-shot): root только готовит верхнеуровневые каталоги.
  # Миграции, JWT и cache warmup выполняются от app (10001:10001), поэтому
  # runtime не получает root-owned cache. Однократный перенос существующих
  # данных и временные ACL выполняет app/bin/file-storage-permissions до init.
  #
  # setgid и umask 0002 сохраняют group-write на новых каталогах и файлах.
  # Рекурсивный chown/chmod uploads при каждом деплое не выполняется.
  #
  # composer install НЕ здесь — vendor уже в образе (см. docker/php-cli/Dockerfile
  # шаг composer install при сборке в CI). Bind-mount'ит только ./app/var,
  # ./app/config/jwt и ./app/public/build, src и vendor берутся из образа.
  #
  # set -e гарантирует остановку всей цепочки при первой ошибке.
  manager_php-cli:
    hostname: ${DOMAIN}
    working_dir: /app
    image: ${REGISTRY}/${IMAGE_NAME}-php-cli:${TAG:-latest}
    # profiles: init — исключён из обычного `up -d`. Запускается ТОЛЬКО явным гейт-шагом
    # `docker compose --profile init run --rm manager_php-cli` ДО свопа (deploy.yml).
    profiles: ["init"]
    command:
      - bash
      - -c
      - |
        set -e
        umask 0002
        mkdir -p var/cache var/log var/uploads/file_storage config/jwt
        chown 10001:10001 var/cache var/log var/uploads var/uploads/file_storage config/jwt
        chmod 2770 var/cache var/log var/uploads var/uploads/file_storage
        su -s /bin/bash app -c '
          rm -rf var/cache/prod
          php bin/console --no-interaction doctrine:migrations:migrate
          php bin/console --no-interaction lexik:jwt:generate-keypair --skip-if-exists
          php bin/console cache:warmup --env=prod --no-debug
        '
    depends_on:
      manager_redis:
        condition: service_started
      manager_db:
        condition: service_healthy
    volumes:
      - ./app/.env:/app/.env:ro
      - ./app/var:/app/var:rw
      - ./app/config/jwt:/app/config/jwt:rw
      - ./app/public/build:/app/public/build:ro

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy читает public/ с хоста — host'овый git checkout содержит index.php,
      # icons/ и т.п. Плюс webpack сборки живут в public/build/, тоже отсюда.
      - ./app/public:/app/public:ro
      - caddy_data:/data
    depends_on:
      manager_php-fpm:
        condition: service_started

  manager_redis:
    hostname: ${DOMAIN}
    working_dir: /app
    image: redis:7.2.1
    restart: always
    volumes:
      - ./docker/redis/data/:/data:rw

  manager_db:
    image: postgres:17-alpine
    shm_size: 128mb
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}" ]
      timeout: 45s
      interval: 10s
      retries: 10
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${DB_EXTERNAL_PORT}:5432
    command: [ "postgres", "-c", "logging_collector=on", "-c", "log_directory=/var/lib/postgresql/data/pg_log", "-c", "log_filename=postgresql.log", "-c", "log_statement=all" ]

volumes:
  caddy_data:
