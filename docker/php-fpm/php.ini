apc.enable_cli = 1
date.timezone = UTC
session.auto_start = Off
short_open_tag = Off
# http://symfony.com/doc/current/performance.html
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
memory_limit=1024M
; App-лимит скана — 8 МБ (DocumentMapper::MAX_FILE_BYTES). PHP-лимиты держим ВЫШЕ него,
; чтобы файлы больше 8 МБ доходили до приложения и отклонялись дружелюбной валидацией
; («макс. 8 МБ»), а не рубились сырым PHP-warning'ом. post > upload (оверхед формы).
upload_max_filesize=16M
post_max_size=20M
