[program:scheduler-compliance]
command=php bin/console messenger:consume scheduler_compliance --time-limit=3600 --memory-limit=128M
directory=/app
autostart=true
autorestart=true
startretries=3
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler-compliance.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=600
stopasgroup=true
killasgroup=true
