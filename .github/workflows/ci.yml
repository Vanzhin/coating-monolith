name: CI

# Гейт: тесты + статика на каждом PR и push в main.
# Тег v* обрабатывается в deploy.yml — этот workflow там не срабатывает.

on:
  pull_request:
  push:
    branches: [main]

# Прокидываем в reusable tests.yml. Правило GitHub: called workflow может только
# сузить permissions caller-а, поэтому нужное для mikepenz/action-junit-report
# (checks: write) выдаём здесь.
permissions:
  contents: read
  checks: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
