name: Tests

# Reusable workflow. Вызывается из ci.yml (на PR/main) и deploy.yml (перед build/deploy).
# Три параллельных job поверх docker-compose.test.yml.

on:
  workflow_call:

# checks: write нужен mikepenz/action-junit-report для публикации check-run с annotations.
# У reusable workflow дефолтные permissions read-only, поэтому объявляем явно.
permissions:
  contents: read
  checks: write

jobs:
  static:
    name: Static (phpstan + php-cs-fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Seed app/.env from example
        # .env в .gitignore → в CI-чекауте отсутствует. Копируем .env.example как источник
        # дефолтов всех переменных (единый список правды). Симфони каскадом накатит поверх
        # .env.test (тестовые оверрайды: DATABASE_URL, REDIS_HOST, JWT_PASSPHRASE, ...).
        # Реальные APP_ENV/DATABASE_URL/REDIS_HOST также приходят из environment: в
        # docker-compose.test.yml — они выигрывают у .env.* (env vs Dotenv).
        run: cp app/.env.example app/.env

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build test_php-cli

      - name: composer install
        # --no-scripts: post-install-cmd (cache:clear) требует app/.env, которого нет в CI-чекауте (в .gitignore).
        # Тестам этот cache:clear не нужен — kernel бутстрапится через tests/bootstrap.php.
        run: docker compose -f docker-compose.test.yml run --rm test_php-cli composer install --no-interaction --prefer-dist --no-scripts

      - name: phpstan
        run: docker compose -f docker-compose.test.yml run --rm test_php-cli vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=1G --no-progress

      - name: php-cs-fixer (dry-run)
        run: docker compose -f docker-compose.test.yml run --rm test_php-cli vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Seed app/.env from example
        # .env в .gitignore → в CI-чекауте отсутствует. Копируем .env.example как источник
        # дефолтов всех переменных (единый список правды). Симфони каскадом накатит поверх
        # .env.test (тестовые оверрайды: DATABASE_URL, REDIS_HOST, JWT_PASSPHRASE, ...).
        # Реальные APP_ENV/DATABASE_URL/REDIS_HOST также приходят из environment: в
        # docker-compose.test.yml — они выигрывают у .env.* (env vs Dotenv).
        run: cp app/.env.example app/.env

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build test_php-cli

      - name: composer install
        # --no-scripts: post-install-cmd (cache:clear) требует app/.env, которого нет в CI-чекауте (в .gitignore).
        # Тестам этот cache:clear не нужен — kernel бутстрапится через tests/bootstrap.php.
        run: docker compose -f docker-compose.test.yml run --rm test_php-cli composer install --no-interaction --prefer-dist --no-scripts

      - name: phpunit tests/Unit
        run: |
          mkdir -p app/tests/_output
          docker compose -f docker-compose.test.yml run --rm test_php-cli \
            vendor/bin/phpunit tests/Unit --colors=never --log-junit tests/_output/junit-unit.xml

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: app/tests/_output/junit-unit.xml
          if-no-files-found: ignore

      - name: Publish junit to summary and annotations
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: app/tests/_output/junit-unit.xml
          check_name: Unit tests (junit)
          include_passed: false
          detailed_summary: true
          job_summary: true

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Seed app/.env from example
        # .env в .gitignore → в CI-чекауте отсутствует. Копируем .env.example как источник
        # дефолтов всех переменных (единый список правды). Симфони каскадом накатит поверх
        # .env.test (тестовые оверрайды: DATABASE_URL, REDIS_HOST, JWT_PASSPHRASE, ...).
        # Реальные APP_ENV/DATABASE_URL/REDIS_HOST также приходят из environment: в
        # docker-compose.test.yml — они выигрывают у .env.* (env vs Dotenv).
        run: cp app/.env.example app/.env

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build test_php-cli

      - name: composer install
        # --no-scripts: post-install-cmd (cache:clear) требует app/.env, которого нет в CI-чекауте (в .gitignore).
        # Тестам этот cache:clear не нужен — kernel бутстрапится через tests/bootstrap.php.
        run: docker compose -f docker-compose.test.yml run --rm test_php-cli composer install --no-interaction --prefer-dist --no-scripts

      - name: doctrine:migrations:migrate
        run: docker compose -f docker-compose.test.yml run --rm test_php-cli bin/console doctrine:migrations:migrate --no-interaction

      # lexik/jwt-authentication-bundle требует пары .pem-ключей по путям из JWT_SECRET_KEY/JWT_PUBLIC_KEY.
      # Файлы в .gitignore → в CI их нет. Генерируем эфемерную пару с passphrase из .env.test.
      - name: Generate JWT keypair
        run: docker compose -f docker-compose.test.yml run --rm test_php-cli bin/console lexik:jwt:generate-keypair --skip-if-exists

      # Twig-шаблоны через WebpackEncoreBundle читают public/build/manifest.json — без него
      # любой рендер страницы отдаёт 500 (Asset RuntimeException). Собираем ассеты в одноразовом
      # node-контейнере (та же схема, что в deploy.yml). encore dev — быстрее production,
      # тестам достаточно наличия манифеста.
      - name: Build webpack assets
        run: |
          docker run --rm \
            -e HOME=/tmp \
            -v "$(pwd)/app:/app" \
            -w /app \
            node:22-alpine \
            sh -c "yarn install --frozen-lockfile && yarn dev"

      - name: phpunit tests/Functional
        run: |
          mkdir -p app/tests/_output
          docker compose -f docker-compose.test.yml run --rm test_php-cli \
            vendor/bin/phpunit tests/Functional --colors=never --log-junit tests/_output/junit-functional.xml

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-functional
          path: app/tests/_output/junit-functional.xml
          if-no-files-found: ignore

      - name: Publish junit to summary and annotations
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: app/tests/_output/junit-functional.xml
          check_name: Functional tests (junit)
          include_passed: false
          detailed_summary: true
          job_summary: true

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
