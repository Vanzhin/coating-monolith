services:
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
  App\Tests\Resource\Fixtures\:
    resource: '%kernel.project_dir%/tests/Resource/Fixtures/*'
    tags:
      - { "name": 'doctrine.fixture.orm' }

  App\Coatings\Infrastructure\Search\TagFinder:
    public: true

  App\Coatings\Infrastructure\Search\CoatingSystemFinder:
    public: true

  App\Coatings\Infrastructure\Cache\CoatingSystemSearchCacheRepository:
    public: true

  App\Coatings\Infrastructure\Cache\CoatingSystemComplianceCacheRepository:
    public: true

  App\ChemicalResistance\Infrastructure\Repository\SubstanceRepository:
    public: true
  App\ChemicalResistance\Infrastructure\Repository\NoteRepository:
    public: true
  App\ChemicalResistance\Infrastructure\Repository\AssessmentRepository:
    public: true

  App\ChemicalResistance\Application\UseCase\Command\Note\CreateNote\CreateNoteCommandHandler:
    public: true
  App\ChemicalResistance\Application\UseCase\Command\Note\UpdateNote\UpdateNoteCommandHandler:
    public: true
  App\ChemicalResistance\Application\UseCase\Command\Note\DeleteNote\DeleteNoteCommandHandler:
    public: true

  App\ChemicalResistance\Application\Service\SubstanceLookup:
    public: true

  # См. комментарий у Assessment-хендлеров ниже: public: true сбрасывает тег
  # messenger.message_handler, поэтому для диспетчеризации через command.bus
  # (QuickCreateAction в HTTP-тесте) возвращаем его явно.
  App\ChemicalResistance\Application\UseCase\Command\Substance\CreateSubstance\CreateSubstanceCommandHandler:
    public: true
    tags:
      - { name: messenger.message_handler, bus: command.bus }
  App\ChemicalResistance\Application\UseCase\Command\Substance\UpdateSubstance\UpdateSubstanceCommandHandler:
    public: true
  App\ChemicalResistance\Application\UseCase\Command\Substance\DeleteSubstance\DeleteSubstanceCommandHandler:
    public: true

  # public: true переопределяет автодискавери из services.yaml и сбрасывает тег
  # messenger.message_handler (его вешает _instanceof, а он действует пофайлово).
  # Прямые вызовы хендлера в тестах это не задевает, но диспетчеризация через
  # command.bus (HTTP-контроллер-тесты by-substance экшенов) без тега падает
  # «No handler» — поэтому возвращаем тег явно.
  App\ChemicalResistance\Application\UseCase\Command\Assessment\CreateAssessment\CreateAssessmentCommandHandler:
    public: true
    tags:
      - { name: messenger.message_handler, bus: command.bus }
  App\ChemicalResistance\Application\UseCase\Command\Assessment\UpdateAssessment\UpdateAssessmentCommandHandler:
    public: true
    tags:
      - { name: messenger.message_handler, bus: command.bus }
  App\ChemicalResistance\Application\UseCase\Command\Assessment\DeleteAssessment\DeleteAssessmentCommandHandler:
    public: true
    tags:
      - { name: messenger.message_handler, bus: command.bus }

  App\ChemicalResistance\Application\Service\ChemicalResistanceImporter:
    public: true

  App\ChemicalResistance\Application\UseCase\Query\ListCoatingAssessments\ListCoatingAssessmentsQueryHandler:
    public: true

  App\ChemicalResistance\Application\UseCase\Query\SubstanceAutocomplete\SubstanceAutocompleteQueryHandler:
    public: true

  App\ChemicalResistance\Application\UseCase\Query\MatchSubstancesForSearch\MatchSubstancesForSearchQueryHandler:
    public: true

  App\ChemicalResistance\Domain\Service\EffectiveAssessmentNotes:
    public: true
