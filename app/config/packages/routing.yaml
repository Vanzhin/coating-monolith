framework:
    router:
        # Базовый адрес для генерации URL вне HTTP (CLI, воркеры уведомлений). Домен — из env DOMAIN (та же
        # переменная, что у Telegram-вебхука), в коде домен не пишем. prod — адрес сайта (задаётся на деплое).
        default_uri: 'https://%env(DOMAIN)%'

when@prod:
    framework:
        router:
            strict_requirements: null
