framework:
    router:
        # Базовый адрес для генерации URL вне HTTP (CLI, воркеры уведомлений). Хост — из env APP_BASE_URL,
        # в коде домен не пишем. dev — http://localhost:8080, prod — адрес сайта (задаётся на деплое).
        default_uri: '%env(APP_BASE_URL)%'

when@prod:
    framework:
        router:
            strict_requirements: null
