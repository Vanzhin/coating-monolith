doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # DBAL 4 требует ЯВНУЮ версию сервера (в 3.x был автодетект). Флот — PostgreSQL 17
        # (образы postgres:17 в test/prod). URL с ?serverVersion=... (как в .env.test) переопределяет.
        server_version: '17'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            drying_time_series: App\Coatings\Infrastructure\Database\DBAL\DryingTimeSeriesType
            dft_range: App\Coatings\Infrastructure\Database\DBAL\DftRangeType
            recoating_interval_tree: App\Coatings\Infrastructure\Database\DBAL\RecoatingIntervalTreeType
            thermal_exposure_limits: App\Coatings\Infrastructure\Database\DBAL\ThermalExposureLimitsType
            mixing_ratio: App\Coatings\Infrastructure\Database\DBAL\MixingRatioType
            cas_number: App\ChemicalResistance\Infrastructure\Database\DBAL\CasNumberType
            string_collection: App\Shared\Infrastructure\Database\DBAL\StringCollectionType
            substrate_scope: App\Coatings\Infrastructure\Database\DBAL\SubstrateScopeType
            document_references: App\Certificates\Infrastructure\Database\DBAL\DocumentReferencesType
            audit_change_set: App\Shared\Infrastructure\Database\DBAL\ChangeSetType
            reports_reference: App\Reports\Infrastructure\Database\DBAL\ReferenceType
            datetime_interval: App\Shared\Infrastructure\Database\DBAL\DateTimeIntervalType
        mapping_types:
            jsonb: json
    orm:
#        auto_generate_proxy_classes: true
#        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        default_entity_manager: default
        # doctrine-bundle 3: авто-резолв сущностей в аргументы контроллера убран (только false).
        # У нас контроллеры тонкие (CommandBus+DTO, сущности не инжектятся) — поведение не меняется.
        controller_resolver:
            auto_mapping: false
        dql:
            string_functions:
                TS_MATCH: App\Coatings\Infrastructure\Database\DQL\TsMatch
                TO_TSQUERY: App\Coatings\Infrastructure\Database\DQL\ToTsquery
                JSONB_GET_TEXT: App\Reports\Infrastructure\Database\DQL\JsonbGetText
            numeric_functions:
                TS_RANK_CD: App\Coatings\Infrastructure\Database\DQL\TsRankCd
                WORD_SIMILARITY: App\Coatings\Infrastructure\Database\DQL\WordSimilarity
                GREATEST: App\Coatings\Infrastructure\Database\DQL\Greatest
                JSONB_GET_INT: App\Coatings\Infrastructure\Database\DQL\JsonbGetInt
                RECOATING_AT_20C: App\Coatings\Infrastructure\Database\DQL\RecoatingAt20C
        mappings:
            Users:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Users/Infrastructure/Database/ORM'
                prefix: 'App\Users\Domain\Entity'
                alias: Users
            Coatings:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Coatings/Infrastructure/Database/ORM/Aggregate'
                prefix: 'App\Coatings\Domain\Aggregate'
                alias: Coatings
            Proposals:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Proposals/Infrastructure/Database/ORM/Aggregate'
                prefix: 'App\Proposals\Domain\Aggregate'
                alias: Proposals
            ValueObject:
              is_bundle: false
              type: xml
              dir: '%kernel.project_dir%/src/Users/Infrastructure/Database/ORM/ValueObject'
              prefix: 'App\Users\Domain\Entity\ValueObject'
              alias: ValueObject
            ChemicalResistance:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/ChemicalResistance/Infrastructure/Database/ORM/Aggregate'
                prefix: 'App\ChemicalResistance\Domain\Aggregate'
                alias: ChemicalResistance
            Certificates:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Certificates/Infrastructure/Database/ORM/Aggregate'
                prefix: 'App\Certificates\Domain\Aggregate'
                alias: Certificates
            Reports:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Reports/Infrastructure/Database/ORM/Aggregate'
                prefix: 'App\Reports\Domain\Aggregate'
                alias: Reports
            Notifications:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Notifications/Infrastructure/Database/ORM'
                prefix: 'App\Notifications\Domain\Entity'
                alias: Notifications
            Audit:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Shared/Infrastructure/Database/ORM/Audit'
                prefix: 'App\Shared\Domain\Audit'
                alias: Audit
            SharedFile:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Shared/Infrastructure/Database/ORM/File'
                prefix: 'App\Shared\Domain\File'
                alias: SharedFile


#            App:
#                is_bundle: false
#                dir: '%kernel.project_dir%/src/Shared/Domain/Entity'
#                prefix: 'App\Shared\Domain\Entity'
#                alias: App
#        controller_resolver:
#            auto_mapping: true

#when@test:
#    doctrine:
#        dbal:
#            # "TEST_TOKEN" is typically set by ParaTest
#            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
