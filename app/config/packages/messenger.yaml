framework:
    messenger:
        default_bus: command.bus
        # Исчерпавшие ретраи сообщения — в failed-транспорт (инспекция/replay), а не молчаливый дроп.
        failure_transport: failed
        buses:
            command.bus:
                middleware:
                    - doctrine_transaction
            query.bus:
            event.bus:
                default_middleware: allow_no_handlers
            message.bus:
                default_middleware: allow_no_handlers

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: 'redis://%env(resolve:REDIS_HOST)%/0'
                options:
                    stream: messages
                    group: symfony
                    consumer: default
                    auto_setup: true
                    delete_after_ack: true
                    stream_max_entries: 10000
            # Dead-letter на Redis. ВАЖНО: redis-messenger берёт имя стрима из ПУТИ DSN
            # (Connection.php: $pathParts[1]) и перетирает options.stream — поэтому стрим задаём
            # именно путём (/failed_messages). Иначе делили бы стрим "0" с async, где включён
            # delete_after_ack, а он запрещён при >1 consumer-группе на одном стриме.
            # НЕ delete_after_ack — сообщения лежат до инспекции/replay.
            failed:
                dsn: 'redis://%env(resolve:REDIS_HOST)%/failed_messages'
                options:
                    group: failed
                    consumer: failed
                    auto_setup: true
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            'App\Shared\Domain\Message\ChannelVerificationMessage': async
            # Активация пользователя → уведомление админу: async (в воркере). Хендлер публикует
            # уведомляющее событие UserActivatedNotification, которое диспетчер доставляет по каналам.
            'App\Users\Domain\Event\UserActivatedEvent': async
            # Уведомляющие события → единый диспетчер фан-аута (inbox/push/email по подпискам), в воркере.
            'App\Notifications\Domain\Event\UserActivatedNotification': async
            # Норма изменилась → пересборка проекций учёта покрытых людей: фан-аут по людям в воркере,
            # чтобы сохранение требования не блокировалось (Compliance Д3).
            'App\Compliance\Domain\Event\RequirementChanged': async
            # Профиль создан/сменил должность → пересборка учёта + черновики карточек (в воркере).
            'App\Personnel\Domain\Event\ProfileSaved': async
            # Акт списания оформлен → пересчёт проекции человека по требованию + черновик на дефицит (в воркере).
            'App\Compliance\Domain\Event\WriteOffActSigned': async
            # Черновик карточки удалён → пересчёт проекции человека по требованию + черновик на дефицит (в воркере).
            'App\Compliance\Domain\Event\DraftDeleted': async
            # Подходит срок выдачи СИЗ → уведомляющее событие на единый диспетчер (inbox/push/email по подпискам).
            'App\Compliance\Domain\Event\ComplianceDueSoon': async

