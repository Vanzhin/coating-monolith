monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - coating
    handlers:
        error:
            type: fingers_crossed
            # 500 errors are logged at the critical level
            action_level: error
            # to also log 400 level errors (but not 404's):
            # action_level: error
            # 405 (method not allowed) — клиентская ошибка, не алертим (иначе GET на POST-only
            # роут шлёт в Telegram; в CI с токеном-заглушкой это роняло запрос).
            excluded_http_codes: [ 401, 403, 404, 405 ]
            channels: [ "!event", "!security", "!doctrine", "!deprecation", "!console" ]
#            channels: [ "!deprecation" ]
            handler: deduplicated
        deduplicated:
            type: deduplication
            # store — писабельный путь вне /app: в рантайме www-data не пишет в /app (var/cache/prod),
            # а дефолтный store падал там Permission denied на каждой ошибке. /tmp контейнера доступен;
            # окна дедупликации (time) хватает эфемерного /tmp.
            store: '/tmp/monolog_dedup'
            # the time in seconds during which duplicate entries are discarded (default: 60)
            time: 10
            handler: telegram
        telegram: # Важна только эта часть
            type: service
            id: telegram_handler
            channels:
             -  coating
            level: debug
        console:
            type: console
            process_psr_3_messages: false
            channels: [ "!event", "!doctrine", "!console" ]

