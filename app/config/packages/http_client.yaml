# Общий HTTP-клиент приложения + аудит исходящих запросов.
# Все ключевые настройки — строками здесь, в коде не зашиты (читаются через bind в services.yaml).
parameters:
    app.http.timeout: 15               # таймаут одной попытки, сек
    app.http.max_retries: 2            # => 3 попытки всего (0 ретраев = 1 попытка)
    app.http.retry_delay_ms: 1000      # базовая задержка перед ретраем
    app.http.retry_multiplier: 2.0     # экспоненциальный множитель задержки
    app.http.audit_body_max_bytes: 16384   # лимит тела в аудите (UTF-8-safe обрезка)
    app.http.audit_enabled: true       # рубильник аудита исходящих запросов

    # NetAngels AI Studio (OpenAI-совместимый). Дефолты — чтобы контейнер поднимался без
    # реальных кредов (CI/test); боевые значения — в окружении деплоя.
    # Хвостовой слэш ОБЯЗАТЕЛЕН: base_uri без него по RFC 3986 роняет /v1 при склейке с 'chat/completions'.
    env(NETANGELS_BASE_URL): 'https://ai.netangels.cloud/v1/'
    env(NETANGELS_API_KEY): ''
    env(NETANGELS_MODEL): 'qwen3.8-flash'

framework:
    http_client:
        default_options:
            timeout: '%app.http.timeout%'
        scoped_clients:
            # Сырой scoped-клиент NetAngels (base_uri/авторизация). Оборачивается в аудируемый
            # (ретрай+аудит) через AuditedHttpClientFactory::wrap в services.yaml → app.http_client.netangels.
            netangels:
                base_uri: '%env(NETANGELS_BASE_URL)%'
                headers:
                    Authorization: 'Bearer %env(NETANGELS_API_KEY)%'
                    Content-Type: 'application/json'
                # timeout = idle (простой между чанками). Запрос нестримовый: модель молчит пока
                # считает весь ответ, поэтому idle должен покрывать ПОЛНОЕ время размышления на
                # большом промпте (опросник ~60-120с). max_duration — жёсткий потолок на попытку.
                timeout: 180
                max_duration: 200
